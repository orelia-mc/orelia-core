# Quest definitions (SOW section 11).
# type: MAIN | SUB | DAILY | WEEKLY | EVENT
# objective type: KILL_MONSTER | COLLECT_ITEM | DELIVER_ITEM | REACH_LOCATION | TALK_NPC | KILL_BOSS | CLEAR_DUNGEON
# target-id is a monsters.yml/bosses.yml/npc.yml/dungeons.yml id, or an items.yml weapon id /
# vanilla Material name for the item objectives. REACH_LOCATION ignores target-id and uses world/x/y/z/radius.
# cooldown-hours: only meaningful when repeatable is true - how long after completion before
# the quest can be re-accepted (default 0 = instantly re-acceptable).
# available-hour-start/available-hour-end: optional time-of-day gate (0-23, server local time).
# Both -1 (the default) disables the gate. Handy for EVENT-type "night only" style quests.
# start-dialogue-id/complete-dialogue-id: optional dialogues.yml tree id played on accept/report
# (NPC flavor). Omit either/both for a quest with no dialogue.
config-version: 2

