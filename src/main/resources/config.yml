# Orelia core configuration.
# Reload with: /oladmin reload
#
# config-version tracks this file's schema. Bump it whenever a new top-level section is
# added - on next startup, ConfigManager appends the new section (with its comments) to any
# existing config.yml that's missing it, without touching anything you've already customized.
# Never bump this for a value-only change (e.g. tweaking a default), only for new/removed keys.
config-version: 12

chat:
  mute:
    # /chat mute <combat|system|party|guild> lets a player mute a notification category
    # (and its sound) themselves. Set to false to disable the subcommand entirely - existing
    # mutes are ignored and every notification behaves as if unmuted - without removing the
    # feature outright.
    enabled: true

skill:
  # Ticks after a skill-fired bow arrow (パワーショット/マルチショット) lands before it's
  # removed - those arrows already can't be picked up, but they'd otherwise sit there
  # indefinitely like a normal stuck arrow. 100 = 5 seconds.
  arrow-despawn-ticks: 100

database:
  # SQLITE or MYSQL
  type: SQLITE
  sqlite:
    file: orelia.db
  mysql:
    host: localhost
    port: 3306
    database: orelia
    username: orelia
    password: ""
    use-ssl: false

status:
  # HP regen here (and any other HP change - damage taken, healing, ...) is applied to the
  # "scaled" HP pool (growth.HP below), then mirrored proportionally onto the player's real
  # vanilla health (which stays fixed near 20 hearts) - see ScaledHealthService.
  regen:
    hp-percent-per-tick: 0.5
    sp-percent-per-tick: 1.0
    # 100 ticks = 5 seconds
    period-ticks: 100
  leveling:
    exp-per-level: 100
    max-level: 80
  # Base value for each stat, used to compute base stats at a given level. HP/SP/ATK/DEF grow
  # exponentially via the shared stat-scaling.growth-rate below (base * rate^(level-1)); the
  # remaining ratio-like stats (CRT/CRT_DMG/SPD) keep a flat base + per-level growth so a crit
  # chance/speed stat doesn't blow past 100%-equivalent within a few dozen levels.
  growth:
    # This is the "scaled" HP max - it can be in the hundreds/thousands/millions, real vanilla
    # health stays fixed near 20 hearts and is kept proportional to this instead
    # (ScaledHealthService).
    HP:
      base: 100
    SP:
      base: 50
    ATK:
      base: 5
    DEF:
      base: 5
    # Fixed regardless of level - per-level is intentionally not read for CRT/CRT_DMG
    # (StatusGrowthConfig#isFixed), only relic/accessory bonuses move these.
    CRT:
      base: 10
    CRT_DMG:
      base: 50
    SPD:
      base: 5
      per-level: 1
  # Feedback shown when a character levels up (StatusService#addExperience). particle/sound are
  # resolved via Particle.valueOf/Sound.valueOf - an invalid name just skips that effect.
  level-up-effect:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    particle: "TOTEM"
    # Staggers the level-up sequence (title -> chat line -> stat-diff lines) instead of
    # sending everything in the same tick - chat-delay-ticks after the title, then
    # stat-delay-ticks after the chat line. Set both to 0 to restore all-at-once behavior.
    chat-delay-ticks: 15
    stat-delay-ticks: 10

economy:
  starting-balance: 100.0

# Per-weapon-instance leveling (distinct from enhancement, see items.yml). A weapon starts at
# its items.yml "level:" and can be raised further via ItemApi#levelUpWeapon /
# "/ol item levelup", gated by the wielder's own character level.
weapon-level:
  # Base attack power bonus per weapon level, e.g. 0.05 = +5% per level.
  attack-power-factor: 0.05
  # Weapon level cap while the player's character level is below tier-step.
  initial-cap: 5
  # From tier-step player levels onward, the cap becomes floor(playerLevel / tier-step) *
  # tier-step - e.g. with the defaults, player level 10-19 -> weapon level cap 10, 20-29 -> 20,
  # 30-39 -> 30, and so on indefinitely.
  tier-step: 10

# Floating damage-number text (rises for duration-ticks then despawns). Works for any hit,
# not just monsters - PvP included.
combat:
  scaled-health:
    # Tagged monsters' true HP (monsters.yml "hp:") can run into the thousands for a
    # high-difficulty boss, far past what's safe to put directly into vanilla's MAX_HEALTH
    # attribute - their vanilla health is capped to this instead and kept proportional to the
    # real value (same idea as players staying at ~20 hearts regardless of their real HP pool).
    # Kept small (matching the player's fixed 20) rather than large: ScaledHealthService converts
    # a scaled hit into "the same percentage of vanilla-cap", so a bigger cap means each hit
    # swings the monster's vanilla health by a bigger absolute amount - which is what drove
    # the exaggerated vanilla hurt-flash/heart-shake effect on high-level monsters at the old
    # default of 1024. Death/kill logic itself is unaffected (still driven by scaled HP hitting
    # 0), only the vanilla-side visual swing per hit shrinks.
    vanilla-cap: 20
  damage-display:
    enabled: true
    duration-ticks: 20
    # Downward acceleration per tick (real entity physics, not a fixed drift speed - see
    # DamageDisplayService) - roughly half of vanilla's ~0.04 gravity by default, so the
    # number visibly falls and speeds up rather than floating at a constant rate.
    gravity-per-tick: 0.014
    # Spawn offset from the hit location (victim's eye height by default) - negative moves it
    # down. Tune this if numbers feel like they're floating too high above the target.
    y-offset: -0.3
    normal-color: "&%f"
    crit-color: "&%6"
    crit-scale: 1.3

# Periodic HUD text shown in the action bar (the line just above the hotbar). {hp}/{max_hp}/
# {sp}/{max_sp}/{atk} are the player's current effective attack power (base attack power after
# ATK%, before the target's own DEF/crit/weakness - see ActionBarService). {level} is the
# character level, {exp_bar} is a "[██████░░░░] 1234/3000" progress bar toward the next level
# (or "MAX" at the level cap).
action-bar:
  enabled: true
  period-ticks: 20
  format: "&%eLv.{level} {exp_bar} &%7| &%c♥ {hp}/{max_hp} &%7| &%b✦ {sp}/{max_sp} &%7| &%e⚔ {atk}"

# Whether a Location is "inside a town" (rpg.town.service.TownDetectionService), used to
# suppress Orelia monster spawns there (see monster: below) and published as rpg.api.TownApi
# for orelia-world/orelia-extra. Detection is WorldGuard-region-based: this plugin never
# defines its own region shapes, it only reads region IDs WorldGuard already knows about
# (soft-depend, reflection-only - see RegionQueryService). No effect if WorldGuard isn't
# installed.
town-detection:
  enabled: true
  # WorldGuard region IDs that count as "a town". A single logical town spread across
  # disjoint areas needs one WorldGuard region per area (region IDs are unique per world) -
  # list every one of them here, e.g.:
  #   town-regions:
  #     - town1_areaA
  #     - town1_areaB
  #     - town2_center
  town-regions: []

monster:
  # Cancels vanilla natural/spawner hostile mob spawning so every enemy in the world comes
  # from an Orelia monster spawn point (/oladmin spawnpoint) instead of random vanilla
  # spawns. Does not affect passive animals or Orelia's own spawns. Orelia's own spawns
  # (spawn points, /oladmin spawn) never spawn inside a town-detection region regardless of
  # this setting - see town-detection above.
  disable-vanilla-hostile-spawning: true
  # Prevents tagged monsters (zombies etc.) from burning in daylight, without affecting
  # other ignition sources (lava, fire blocks, fire-elemental skills).
  sun-immunity:
    enabled: true
  # Renders every tagged monster's nametag as a live HP bar, updated after each hit
  # (MonsterHealthBarListener). {name}/{bar}/{current}/{max} placeholders in "format".
  health-bar:
    enabled: true
    length: 10
    format: "{name} &%7[{bar}&%7] &%f{current}/{max}"
    filled-color: "&%a"
    empty-color: "&%8"
  # Extra multiplier layered on top of stat-scaling.growth-rate below, applying ONLY to a
  # monster spawned with a targetLevel (leaving level-less monsters completely untouched -
  # MonsterLevelScalingConfig#scale's null-targetLevel guard runs before this is ever used).
  # A monster growing at exactly the player-shared rate turned out to fall far behind by max
  # level (a geared player one-shotting a same-level monster) - this restores some of the
  # extra edge monsters had before stat growth was unified with players, without going back to
  # the old, far more extreme monster-only rates. effective rate = growth-rate.X * this value.
  target-level-bonus:
    HP: 1.02
    ATK: 1.015
    DEF: 1.012

# Shared exponential growth rate for HP/ATK/DEF, used both by per-spawn-point monster stat
# scaling (/oladmin spawnpoint add ... [targetLevel]) and by player character stat growth
# (status.growth above): scaled = base * growth-rate^(level - 1). Each value is the per-level
# growth multiplier itself (e.g. 1.045 = +4.5% per level, compounding), not an additive "extra
# percent". Monster spawn-point targetLevel 1, or leaving it unset (the default for every
# existing spawn point), leaves the monster exactly as its monsters.yml template - fully
# backward compatible. SP has no monster equivalent, so it's player-only.
stat-scaling:
  growth-rate:
    HP: 1.045
    SP: 1.04
    ATK: 1.035
    DEF: 1.03

quest:
  # How often (in ticks) each online player's COLLECT_ITEM / DELIVER_ITEM / REACH_LOCATION
  # objectives are re-checked. 40 ticks = 2 seconds.
  objective-check-period-ticks: 40
  completion-feedback:
    # Title + action-bar shown when a quest's objectives are all met. Disable if it doesn't
    # suit your server's pacing - the quest still transitions to AWAITING_REPORT either way.
    enabled: true

dungeon:
  # Relics (rpg.api.RelicApi#generateRelic) granted to each member when a bossed dungeon is
  # cleared - boss-less dungeons never drop relics regardless of these values.
  relic-drop-min: 1
  relic-drop-max: 3

party:
  max-size: 6
  # Plays a sound for the invitee alongside "party.invite-received", same fail-open
  # Sound.valueOf pattern as mail's notify-sound below.
  notify-sound:
    enabled: true
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0

friend:
  max-friends: 50

guild:
  # Plays a sound for the invitee alongside "guild.invite-received".
  notify-sound:
    enabled: true
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0

mail:
  # A player's send-from-player mail is rejected once their inbox holds this many messages
  # (system mail like auction sale notices bypasses this limit).
  max-retained-per-player: 100
  # Read mail with no unclaimed attachments older than this many days is auto-deleted.
  retention-days: 30
  # How often (in ticks) the auto-delete sweep runs. 72000 ticks = 1 hour.
  purge-check-period-ticks: 72000
  # Plays a sound for the player alongside the join-time unread notice, so it's noticed even
  # if they're not looking at chat. Invalid sound names just skip the sound (logged as a
  # warning), same fail-open behavior as other Sound.valueOf-driven config in this suite.
  notify-sound:
    enabled: true
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0

auction:
  # Fraction of the sale price (buy-now) or final bid amount (bid auction) deducted as a fee
  # on a successful settlement (0.05 = 5%), deposited to nobody - a straightforward money sink.
  fee-rate: 0.05
  # A seller can't have more than this many ACTIVE or not-yet-collected EXPIRED listings
  # occupying a slot at once (buy-now and bid listings share this same cap).
  max-listings-per-seller: 10
  # Default listing duration for /ol auction sell and /ol auction start.
  default-duration-hours: 72
  # How often (in ticks) the sweep that both closes expired listings and settles finished bid
  # auctions runs. 1200 = 1 minute.
  expiry-check-period-ticks: 1200
  bid:
    # A new bid must exceed the current highest bid (or the starting price, if none yet) by at
    # least this fraction (0.05 = 5%) - rate-based like fee-rate, not a flat currency amount
    # that ages badly as listing prices vary.
    min-increment-rate: 0.05

trade:
  # A trade request auto-expires (both sides notified) if not accepted within this many seconds.
  request-timeout-seconds: 30
  # An open trade session auto-cancels (items returned) if neither side confirms within this many seconds.
  session-timeout-seconds: 300
  # Max items either side can have in their offer at once.
  max-items-per-offer: 9
  # Plays a sound for the target alongside "trade.request-received".
  notify-sound:
    enabled: true
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0

pet:
  growth:
    # Growth XP granted to the player's currently-selected pet species for each tagged
    # (monsters.yml-defined) monster killed while that pet is summoned. Gated on CombatApi's
    # own "is this a real tagged monster" check, same as quest KILL_MONSTER objectives - a
    # vanilla cow/zombie never grants this. The per-level stat curve itself lives in
    # pets.yml (species template data), not here.
    xp-per-kill: 5

mount:
  growth:
    xp-per-kill: 5

