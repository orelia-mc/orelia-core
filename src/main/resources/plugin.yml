name: OreliaCore
version: '${version}'
main: rpg.core.OreliaPlugin
api-version: '1.21'
authors: [rasp1220, Nyaffle]
description: RPG suite plugin (combat, player, status, content, and social/economy layers) - weapons, skills, jobs, status, accessories, monsters, bosses, effects, economy, GUI, database, quest, NPC, dialogue, story, dungeon, cutscene, event, party, guild, trade, mail, auction, housing, pet, mount, ranking, achievement, public API
folia-supported: false

softdepend: [WorldGuard, Vault]

commands:
  ol:
    description: Orelia player commands (item, job, status, and more registered by orelia-world/orelia-extra)
    usage: /ol <item|job|status|...> ...
  oladmin:
    description: Orelia admin commands (reload, spawn, spawnpoint, and more registered by orelia-world/orelia-extra)
    usage: /oladmin <reload|spawn <monsterId>|spawnboss <bossId>|spawnpoint <add|remove|list>|...>
    permission: orelia.admin
    permission-message: "&%c権限がありません。このコマンドは運営(OP)専用です。"

permissions:
  orelia.admin:
    default: op
